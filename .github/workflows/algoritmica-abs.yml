name: algoritmica-abs

on:
  pull_request:
    paths:
      - 'plugins/partner-built/algoritmica/**'
      - '.github/workflows/algoritmica-abs.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/partner-built/algoritmica/**'
      - '.github/workflows/algoritmica-abs.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test direct API retrieval and portfolio calculations
        run: python -m unittest discover -s plugins/partner-built/algoritmica/skills/abs-portfolio/tests -v
